<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Execução de Prova</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      user-select: none;
    }
  </style>
</head>

<body
  class="
    bg-slate-950
    text-slate-100
    min-h-screen
    flex
    flex-col
  "
>

  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <header
    class="
      bg-slate-900
      border-b
      border-slate-800
      px-6
      py-3
      flex
      justify-between
      items-center
      sticky
      top-0
      z-50
    "
  >

    <div>

      <h1
        id="titulo-exame"
        class="
          font-bold
          text-sm
          text-slate-200
        "
      >
        Carregando Prova...
      </h1>

      <p
        id="info-aluno"
        class="
          text-xs
          text-slate-400
        "
      ></p>

    </div>


    <div
      class="
        flex
        items-center
        space-x-6
      "
    >

      <!-- BOTÃO DE INÍCIO -->

      <button
        id="btn-iniciar-prova"
        type="button"
        class="
          hidden
          bg-emerald-600
          hover:bg-emerald-500
          active:bg-emerald-700
          transition
          px-5
          py-2
          rounded-lg
          text-sm
          font-bold
          text-white
          shadow-lg
        "
      >
        INICIAR PROVA
      </button>


      <!-- CRONÔMETRO -->

      <div class="text-right">

        <span
          class="
            block
            text-[10px]
            text-slate-400
            uppercase
          "
        >
          Tempo Restante
        </span>

        <span
          id="cronometro"
          class="
            text-xl
            font-mono
            font-bold
            text-emerald-400
          "
        >
          --:--
        </span>

      </div>


      <!-- ALERTAS -->

      <div
        class="
          text-right
          border-l
          border-slate-800
          pl-6
        "
      >

        <span
          class="
            block
            text-[10px]
            text-slate-400
            uppercase
          "
        >
          Alertas de Saída
        </span>

        <span
          id="contador-alertas"
          class="
            text-xl
            font-mono
            font-bold
            text-amber-400
          "
        >
          0
        </span>

      </div>

    </div>

  </header>


  <!-- =====================================================
       AVISO DE PREPARAÇÃO
       ===================================================== -->

  <div
    id="aviso-preparacao"
    class="
      hidden
      bg-blue-950
      border-b
      border-blue-800
      px-4
      py-3
      text-center
      text-sm
      text-blue-200
    "
  >

    Faça login na sua conta Google, caso seja solicitado.

    Quando o formulário da avaliação estiver pronto,
    clique em

    <strong class="text-white">
      INICIAR PROVA
    </strong>.

    O cronômetro começará somente nesse momento.

  </div>


  <!-- =====================================================
       GOOGLE FORMS
       ===================================================== -->

  <main
    id="container-forms"
    class="
      flex-grow
      relative
    "
  >

    <!-- LOADER -->

    <div
      id="loader"
      class="
        absolute
        inset-0
        flex
        items-center
        justify-center
        bg-slate-950
        z-10
      "
    >

      <p class="text-slate-400">
        Preparando avaliação...
      </p>

    </div>


    <!-- FORMULÁRIO -->

    <iframe
      id="iframe-forms"
      src=""
      class="
        w-full
        h-full
        border-0
        min-h-[calc(100vh-65px)]
      "
      allow="fullscreen"
    ></iframe>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script
    type="module"
    src="./assets/js/prova.js"
  ></script>

</body>

</html>
