<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#0f172a">

  <title>Execução de Prova</title>

  <script src="https://cdn.tailwindcss.com"></script>


  <style>

    body {
      user-select: none;
      -webkit-user-select: none;
    }


    #iframe-forms {
      display: block;
      width: 100%;
      height: 100%;
    }

  </style>

</head>


<body
  class="
    bg-slate-950
    text-slate-100
    min-h-screen
    flex
    flex-col
  "
>


  <!-- =====================================================
       BARRA SUPERIOR
       ===================================================== -->

  <header
    class="
      bg-slate-900
      border-b
      border-slate-800
      px-4
      md:px-6
      py-3
      flex
      justify-between
      items-center
      sticky
      top-0
      z-50
    "
  >

    <!-- INFORMAÇÕES -->

    <div class="min-w-0">

      <h1
        id="titulo-exame"
        class="
          font-bold
          text-sm
          text-slate-200
          truncate
        "
      >
        Carregando Prova...
      </h1>


      <p
        id="info-aluno"
        class="
          text-xs
          text-slate-400
          truncate
        "
      ></p>

    </div>


    <!-- INDICADORES -->

    <div
      class="
        flex
        items-center
        space-x-4
        md:space-x-6
        ml-4
      "
    >

      <!-- CRONÔMETRO -->

      <div class="text-right">

        <span
          class="
            block
            text-[9px]
            md:text-[10px]
            text-slate-400
            uppercase
          "
        >
          Tempo Restante
        </span>


        <span
          id="cronometro"
          class="
            text-lg
            md:text-xl
            font-mono
            font-bold
            text-emerald-400
          "
        >
          --:--
        </span>

      </div>


      <!-- ALERTAS -->

      <div
        class="
          text-right
          border-l
          border-slate-800
          pl-4
          md:pl-6
        "
      >

        <span
          class="
            block
            text-[9px]
            md:text-[10px]
            text-slate-400
            uppercase
          "
        >
          Alertas
        </span>


        <span
          id="contador-alertas"
          class="
            text-lg
            md:text-xl
            font-mono
            font-bold
            text-amber-400
          "
        >
          0
        </span>

      </div>

    </div>

  </header>


  <!-- =====================================================
       ÁREA DA PROVA
       ===================================================== -->

  <main
    id="container-forms"
    class="
      flex-grow
      relative
      min-h-[calc(100vh-65px)]
    "
  >


    <!-- ===================================================
         GOOGLE FORMS
         =================================================== -->

    <iframe
      id="iframe-forms"
      src=""
      class="
        absolute
        inset-0
        w-full
        h-full
        border-0
      "
      allow="fullscreen"
    ></iframe>


    <!-- ===================================================
         CARREGAMENTO
         =================================================== -->

    <div
      id="loader"
      class="
        absolute
        inset-0
        flex
        items-center
        justify-center
        bg-slate-950
        z-30
      "
    >

      <div class="text-center">

        <div
          class="
            w-10
            h-10
            border-4
            border-slate-700
            border-t-blue-500
            rounded-full
            animate-spin
            mx-auto
            mb-4
          "
        ></div>


        <p class="text-slate-400">
          Preparando avaliação...
        </p>


        <p
          class="
            text-xs
            text-slate-600
            mt-2
          "
        >
          O cronômetro será iniciado automaticamente.
        </p>

      </div>

    </div>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script
    type="module"
    src="./assets/js/prova.js"
  ></script>

</body>

</html>
