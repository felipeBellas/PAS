<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gerenciar Usuários - PAS-PROVA</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-900 text-slate-100 p-6">

  <!-- =====================================================
       CONTEÚDO PROTEGIDO
       ===================================================== -->

  <div
    id="conteudo-usuarios"
    class="hidden max-w-5xl mx-auto space-y-8"
  >


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header
      class="
        flex
        flex-col
        sm:flex-row
        sm:justify-between
        sm:items-center
        gap-4
        border-b
        border-slate-800
        pb-4
      "
    >

      <div>

        <h1 class="text-2xl font-bold text-blue-500">
          Gerenciar Usuários
        </h1>

        <p class="text-xs text-slate-500 mt-1">
          PAS-PROVA • Administração
        </p>

      </div>


      <button
        id="btn-voltar-painel"
        type="button"
        class="
          bg-slate-700
          hover:bg-slate-600
          text-slate-200
          text-sm
          px-4
          py-2
          rounded
          transition
        "
      >
        Voltar ao Painel
      </button>

    </header>



    <!-- =====================================================
         INFORMAÇÕES
         ===================================================== -->

    <div
      class="
        bg-slate-800
        border
        border-slate-700
        rounded-xl
        p-5
      "
    >

      <h2 class="font-bold text-slate-200">
        Administração de contas
      </h2>

      <p class="text-sm text-slate-400 mt-2">
        Nesta área o administrador poderá visualizar e
        gerenciar os usuários autorizados a utilizar o
        PAS-PROVA.
      </p>

    </div>



    <!-- =====================================================
         USUÁRIOS
         ===================================================== -->

    <section
      class="
        bg-slate-800
        border
        border-slate-700
        rounded-xl
        p-6
      "
    >


      <div
        class="
          flex
          flex-col
          sm:flex-row
          sm:justify-between
          sm:items-center
          gap-3
          mb-5
        "
      >

        <div>

          <h2 class="text-xl font-bold text-slate-200">
            Usuários cadastrados
          </h2>

          <p
            id="total-usuarios"
            class="text-xs text-slate-500 mt-1"
          >
            Carregando...
          </p>

        </div>


        <button
          id="btn-atualizar-usuarios"
          type="button"
          class="
            bg-slate-700
            hover:bg-slate-600
            text-slate-200
            text-xs
            px-4
            py-2
            rounded
            transition
          "
        >
          Atualizar
        </button>

      </div>



      <!-- LISTA -->

      <div
        id="lista-usuarios"
        class="space-y-4"
      >

        <p class="text-slate-500">
          Carregando usuários...
        </p>

      </div>

    </section>


  </div>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script
    type="module"
    src="./assets/js/usuarios.js"
  ></script>

</body>

</html>
