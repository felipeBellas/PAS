<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel do Professor</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  body.painel-bloqueado {
    visibility: hidden;
  }
</style>
  
</head>

<body class="painel-bloqueado bg-slate-900 text-slate-100 p-6">

  <div class="max-w-5xl mx-auto space-y-8">

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header
      class="
        flex
        justify-between
        items-center
        border-b
        border-slate-800
        pb-4
      "
    >
      <div>
        <h1 class="text-2xl font-bold text-blue-500">
          Painel do Professor
        </h1>

        <p class="text-xs text-slate-500 mt-1">
          PAS-PROVA
        </p>
      </div>

      <button
  id="btn-sair-professor"
  type="button"
  class="
    text-sm
    text-slate-400
    hover:text-white
  "
>
  Sair
</button>
      
    </header>


    <!-- =====================================================
         CADASTRO / EDIÇÃO DA PROVA
         ===================================================== -->

    <div
      class="
        bg-slate-800
        p-6
        rounded-xl
        border
        border-slate-700
      "
    >

      <div
        class="
          flex
          justify-between
          items-center
          mb-4
          gap-4
        "
      >

        <h2
          id="titulo-formulario"
          class="text-xl font-bold text-slate-200"
        >
          Cadastrar Nova Prova
        </h2>

        <button
          id="btn-cancelar-edicao"
          type="button"
          class="
            hidden
            bg-slate-700
            hover:bg-slate-600
            text-slate-200
            text-sm
            px-4
            py-2
            rounded
          "
        >
          Cancelar edição
        </button>

      </div>


      <form
        id="form-criar-prova"
        class="
          grid
          grid-cols-1
          md:grid-cols-2
          gap-4
        "
      >

        <!-- ID interno usado durante edição -->
        <input
          type="hidden"
          id="prova-id"
          value=""
        >


        <!-- TÍTULO -->

        <div>

          <label
            class="
              block
              text-xs
              text-slate-400
              mb-1
            "
          >
            Título da Avaliação
          </label>

          <input
            type="text"
            id="titulo-prova"
            required
            placeholder="Ex: P1 - Citologia"
            class="
              w-full
              bg-slate-900
              border
              border-slate-700
              p-2.5
              rounded
              text-white
            "
          >

        </div>


        <!-- TURMA -->

        <div>

          <label
            class="
              block
              text-xs
              text-slate-400
              mb-1
            "
          >
            Turma / Disciplina
          </label>

          <input
            type="text"
            id="turma-disciplina"
            required
            placeholder="Ex: 3º Ano A - Biologia"
            class="
              w-full
              bg-slate-900
              border
              border-slate-700
              p-2.5
              rounded
              text-white
            "
          >

        </div>


        <!-- GOOGLE FORMS -->

        <div class="md:col-span-2">

          <label
            class="
              block
              text-xs
              text-slate-400
              mb-1
            "
          >
            Link do Google Forms
          </label>

          <input
            type="url"
            id="link-forms"
            required
            placeholder="https://docs.google.com/forms/d/e/.../viewform"
            class="
              w-full
              bg-slate-900
              border
              border-slate-700
              p-2.5
              rounded
              text-white
            "
          >

        </div>


        <!-- CÓDIGO -->

        <div>

          <label
            class="
              block
              text-xs
              text-slate-400
              mb-1
            "
          >
            Código Único
          </label>

          <input
            type="text"
            id="codigo-unico"
            required
            placeholder="Ex: BIO-101"
            autocomplete="off"
            class="
              w-full
              bg-slate-900
              border
              border-slate-700
              p-2.5
              rounded
              text-white
              uppercase
            "
          >

        </div>


        <!-- DURAÇÃO -->

        <div>

          <label
            class="
              block
              text-xs
              text-slate-400
              mb-1
            "
          >
            Duração (Minutos)
          </label>

          <input
            type="number"
            id="duracao-minutos"
            value="50"
            min="1"
            required
            class="
              w-full
              bg-slate-900
              border
              border-slate-700
              p-2.5
              rounded
              text-white
            "
          >

        </div>


        <!-- SAÍDAS -->

        <div>

          <label
            class="
              block
              text-xs
              text-slate-400
              mb-1
            "
          >
            Limite Tolerado de Saídas de Tela
          </label>

          <input
            type="number"
            id="limite-saidas"
            value="2"
            min="0"
            required
            class="
              w-full
              bg-slate-900
              border
              border-slate-700
              p-2.5
              rounded
              text-white
            "
          >

        </div>


        <!-- SALVAR -->

        <div class="md:col-span-2">

          <button
            id="btn-salvar-prova"
            type="submit"
            class="
              w-full
              bg-blue-600
              hover:bg-blue-500
              font-bold
              py-3
              rounded
              text-white
              transition
            "
          >
            SALVAR E GERAR PROVA
          </button>

        </div>

      </form>

    </div>


    <!-- =====================================================
         PROVAS CADASTRADAS
         ===================================================== -->

    <div
      class="
        bg-slate-800
        p-6
        rounded-xl
        border
        border-slate-700
      "
    >

      <div
        class="
          flex
          justify-between
          items-center
          mb-4
        "
      >

        <h2 class="text-xl font-bold text-slate-200">
          Provas Cadastradas
        </h2>

        <button
          id="btn-atualizar-lista"
          type="button"
          class="
            text-xs
            bg-slate-700
            hover:bg-slate-600
            px-3
            py-2
            rounded
            text-slate-200
          "
        >
          Atualizar
        </button>

      </div>


      <div
        id="lista-provas"
        class="space-y-4"
      >

        <p class="text-slate-500">
          Carregando exames...
        </p>

      </div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script
    type="module"
    src="./assets/js/professor.js"
  ></script>

</body>
</html>
